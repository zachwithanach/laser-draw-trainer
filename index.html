<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laser Draw Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#e4e7e2; --surface:#f6f7f4; --text:#15191b; --muted:#5d6864; --line:#bcc4bd;
  --accent:#e4631a; --accent-ink:#ffffff; --ok:#1d8a4a; --bad:#c42a1b; --stage:#101314;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#171b1e; --surface:#21272b; --text:#eef1ee; --muted:#95a19c; --line:#343d42;
    --accent:#ff7a2e; --accent-ink:#15191b; --ok:#3fd37f; --bad:#ff5a47; --stage:#0d1012;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171b1e; --surface:#21272b; --text:#eef1ee; --muted:#95a19c; --line:#343d42;
  --accent:#ff7a2e; --accent-ink:#15191b; --ok:#3fd37f; --bad:#ff5a47; --stage:#0d1012;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--body); font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased; }
.app{ max-width:600px; margin:0 auto; padding:12px 14px 40px; }
header{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }
h1{ font-family:var(--display); font-weight:700; font-size:28px; margin:0; letter-spacing:.01em; }
.pill{ font-size:13px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap; }
.pill.on{ color:var(--ok); border-color:var(--ok); }
.stage{ position:relative; width:100%; aspect-ratio:4/3; background:var(--stage); border-radius:10px; overflow:hidden; touch-action:manipulation; }
.stage video,.stage canvas{ position:absolute; inset:0; width:100%; height:100%; }
.stage canvas{ touch-action:none; }
.callout{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:160px; line-height:1; color:#ffffff; text-shadow:0 2px 16px rgba(0,0,0,.6); pointer-events:none; opacity:0; }
.callout.on{ opacity:.92; }
.stage video{ object-fit:fill; }
.stage .hint{ position:absolute; left:0; right:0; bottom:0; padding:10px 12px; font-size:15px; color:#f2f2f2; background:linear-gradient(transparent,rgba(0,0,0,.7)); pointer-events:none; }
.stage .hint:empty{ display:none; }
.readout{ display:grid; grid-template-columns:1fr auto; align-items:end; gap:8px; margin:14px 0 4px; }
.clock{ font-family:var(--display); font-weight:700; font-size:88px; line-height:.9; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.clock small{ font-size:32px; font-weight:500; color:var(--muted); margin-left:4px; }
.clock.under{ color:var(--ok); }
.clock.over{ color:var(--bad); }
.result{ text-align:right; font-family:var(--display); font-weight:500; font-size:20px; line-height:1.1; color:var(--muted); }
.result .zone{ display:block; font-size:40px; font-weight:700; color:var(--text); }
.parbar{ height:10px; border-radius:5px; background:var(--line); overflow:hidden; margin:6px 0 2px; }
.parbar span{ display:block; height:100%; width:0; background:var(--ok); }
.parbar.over span{ background:var(--bad); }
.stage{ outline:8px solid transparent; outline-offset:-8px; }
.stage.par-under{ outline-color:var(--ok); }
.stage.par-over{ outline-color:var(--bad); }
.clock.live-over{ color:var(--bad); }
.meter{ position:relative; height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin:6px 0 4px; }
.meter span{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--accent); }
.meter i{ position:absolute; top:0; bottom:0; width:2px; background:var(--text); }
.status{ min-height:22px; color:var(--muted); font-size:15px; }
.controls{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:12px 0; }
button{ font:inherit; font-family:var(--display); font-weight:600; font-size:19px; letter-spacing:.01em; padding:12px 8px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; min-height:48px; }
button.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button.quiet{ font-family:var(--body); font-weight:600; font-size:14px; padding:8px 12px; min-height:36px; }
button:disabled{ opacity:.45; cursor:default; }
button:focus-visible,input:focus-visible,select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
details{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:12px 0; }
summary{ cursor:pointer; font-family:var(--display); font-weight:600; font-size:20px; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-top:10px; }
.field{ display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--muted); }
.field input,.field select{ font:inherit; font-size:16px; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; width:100%; }
.field.wide{ grid-column:1 / -1; }
.check{ flex-direction:row; align-items:center; gap:8px; color:var(--text); }
.check input{ width:20px; height:20px; }
.panel{ display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:12px; }
#map{ width:150px; height:auto; border-radius:4px; }
.stats{ font-size:15px; }
.stats .row{ display:flex; justify-content:space-between; gap:12px; padding:3px 0; border-bottom:1px solid var(--line); }
.stats .row:last-child{ border-bottom:0; }
.stats b{ font-family:var(--display); font-weight:700; font-size:20px; }
.analysis{ margin-top:12px; }
.ana-head{ display:flex; gap:12px; margin-top:10px; }
.ana-head .field{ min-width:170px; }
.ana-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:12px; }
.ana-grid div{ background:var(--bg); border-radius:8px; padding:8px 10px; }
.ana-grid span{ display:block; font-size:13px; color:var(--muted); }
.ana-grid b{ font-family:var(--display); font-weight:700; font-size:24px; font-variant-numeric:tabular-nums; }
.ana-targets{ margin-top:10px; font-size:15px; font-variant-numeric:tabular-nums; }
.ana-targets div{ display:flex; justify-content:space-between; gap:12px; padding:3px 0; border-bottom:1px solid var(--line); }
.ana-targets div:last-child{ border-bottom:0; }
.ana-notes{ margin:12px 0 0; padding-left:20px; font-size:15px; }
.ana-notes li{ margin:4px 0; }
.history{ margin-top:12px; max-height:280px; overflow:auto; }
.history table{ width:100%; border-collapse:collapse; font-size:15px; font-variant-numeric:tabular-nums; }
.history td,.history th{ text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
.history th{ color:var(--muted); font-weight:600; font-size:13px; }
.history td.t{ font-family:var(--display); font-size:18px; font-weight:600; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.empty{ color:var(--muted); font-size:15px; }
.field[hidden]{ display:none; }
.tv{ position:fixed; inset:0; z-index:50; background:#0b0f14; }
.tv[hidden]{ display:none; }
.tv canvas{ position:absolute; inset:0; width:100%; height:100%; }
.tv-msg{ position:absolute; left:0; right:0; top:calc(14px + env(safe-area-inset-top,0px)); padding:0 18px; text-align:center; font-family:var(--display); font-weight:600; font-size:clamp(20px, 4vw, 40px); line-height:1.15; color:rgb(170,186,208); white-space:pre-line; pointer-events:none; }
.tv-bar{ position:absolute; left:0; right:0; bottom:0; display:flex; gap:10px; justify-content:center; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); }
.tv-bar button{ min-width:130px; }
.tv[data-phase="locate"] .tv-msg,.tv[data-phase="locate"] .tv-bar{ visibility:hidden; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
@media (max-width:380px){ .clock{ font-size:72px; } .controls{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Laser draw trainer</h1>
    <span class="pill" id="pill">Camera off</span>
  </header>

  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div class="callout" id="callout"></div>
    <div class="hint" id="hint">Start the camera, then calibrate the target.</div>
  </div>

  <div class="readout">
    <div class="clock" id="clock">0.00<small>s</small></div>
    <div class="result"><span class="zone" id="zone">&mdash;</span><span id="repLabel">No reps yet</span></div>
  </div>
  <div class="parbar" id="parBar" title="Par time"><span id="parFill"></span></div>
  <div class="meter" id="meter" hidden title="Microphone level"><span id="meterBar"></span><i id="meterThr"></i></div>
  <div class="status" id="status"></div>

  <div class="controls">
    <button id="btnCam">Start camera</button>
    <button id="btnCal" disabled>Calibrate</button>
    <button id="btnDrill" class="primary" disabled>Start drill</button>
  </div>

  <details id="settings">
    <summary>Settings</summary>
    <div class="grid">
      <label class="field wide">Laser type
        <select id="sMode"><option value="always">Always on (shot = trigger click)</option><option value="pulse">Pulse (fires on trigger)</option></select>
      </label>
      <label class="field wide">Drill
        <select id="sDrill"><option value="draw">Draw to first shot</option><option value="string">String (needs a resetting trigger)</option></select>
      </label>
      <label class="field">Click threshold (0.01 to 1)<input id="sClick" type="number" min="0.01" max="1" step="0.01"></label>
      <label class="field">Reset window (ms)<input id="sResetMs" type="number" min="150" max="1500" step="25"></label>
      <label class="field wide">Trigger reset click
        <select id="sTrig"><option value="none">None: one click per press</option><option value="level">Quieter than the shot: filtered by the threshold</option><option value="skip">As loud as the shot: skip the click after each shot</option></select>
      </label>
      <label class="field">Targets (1 to 4)<input id="sTargets" type="number" min="1" max="4" step="1"></label>
      <label class="field">Laser color
        <select id="sColor"><option value="red">Red</option><option value="green">Green</option><option value="any">Either</option></select>
      </label>
      <label class="field">Sensitivity (0 to 100)<input id="sSens" type="number" min="0" max="100" step="5"></label>
      <label class="field">Shortest start delay (s)<input id="sMin" type="number" min="0.5" max="20" step="0.5"></label>
      <label class="field">Longest start delay (s)<input id="sMax" type="number" min="0.5" max="20" step="0.5"></label>
      <label class="field" data-drill="draw">Par time (s)<input id="sPar" type="number" min="0.3" max="10" step="0.05"></label>
      <label class="field" data-drill="string">String par (s)<input id="sStringPar" type="number" min="0.5" max="60" step="0.05"></label>
      <label class="field" data-drill="string">Shots per target (1 to 6)<input id="sPerTarget" type="number" min="1" max="6" step="1"></label>
      <label class="field" data-drill="string">Power factor
        <select id="sPF"><option value="minor">Minor (A 5, C 3, D 1)</option><option value="major">Major (A 5, C 4, D 2)</option></select>
      </label>
      <label class="field">No-shot timeout (s)<input id="sTimeout" type="number" min="2" max="30" step="1"></label>
      <label class="field">Target width (in)<input id="sTW" type="number" min="2" max="48" step="0.5"></label>
      <label class="field">Target height (in)<input id="sTH" type="number" min="2" max="72" step="0.5"></label>
      <label class="field">Camera latency offset (ms)<input id="sLat" type="number" min="-200" max="500" step="5"></label>
      <label class="field">Pause between reps (s)<input id="sRepeat" type="number" min="2" max="30" step="1"></label>
      <label class="field check wide"><input id="sParBeep" type="checkbox"> Second beep at par time (the mic pauses for 0.2 s during it, so a shot right at par can be missed)</label>
      <label class="field check wide"><input id="sAuto" type="checkbox"> Start the next rep automatically</label>
    </div>
    <div class="actions">
      <button class="quiet" id="btnLearn">Learn trigger click</button>
      <button class="quiet" id="btnBeep">Test beep</button>
      <button class="quiet" id="btnSim">Simulate a string</button>
      <button class="quiet" id="btnTV">TV screen test</button>
      <button class="quiet" id="btnReset">Reset settings</button>
    </div>
  </details>

  <div class="panel">
    <canvas id="map" width="150" height="194"></canvas>
    <div class="stats" id="stats"></div>
  </div>
  <details class="analysis" id="analysis" open>
    <summary>Analysis</summary>
    <div class="ana-head">
      <label class="field">Data<select id="anaScope"><option value="session">This session</option><option value="all">All history</option></select></label>
    </div>
    <div class="ana-grid" id="anaGrid"></div>
    <div class="ana-targets" id="anaTargets"></div>
    <ul class="ana-notes" id="anaNotes"></ul>
    <div class="actions"><button class="quiet" id="btnPar" hidden></button></div>
  </details>
  <div class="history" id="history"></div>
  <div class="actions">
    <button class="quiet" id="btnCopy">Copy history as JSON</button>
    <button class="quiet" id="btnClear">Clear history</button>
  </div>
</div>

<div class="tv" id="tv" hidden data-phase="off">
  <canvas id="tvCanvas"></canvas>
  <div class="tv-msg" id="tvMsg" aria-live="polite"></div>
  <div class="tv-bar">
    <button class="primary" id="tvStart">Start test</button>
    <button id="tvCopy" hidden>Copy results</button>
    <button id="tvClose">Close</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Detection. Pure function of pixel data; no DOM access. Covered by tests/run.js.
// ---------------------------------------------------------------------------
// @ldt-detector-start
function createDetector(W, H){
  const n = W * H;
  const bgM = new Float32Array(n);   // background: brightest channel per pixel
  const bgS = new Float32Array(n);   // background: laser-color dominance per pixel
  const curM = new Uint8Array(n), curS = new Uint8Array(n);
  const mask = new Uint8Array(n);
  const stack = new Int32Array(n);
  const WARM = 15;
  let frames = 0;

  // d: RGBA pixel data. o: { sens 0-100, color 'red'|'green'|'any' }
  // Candidate pixels are excluded from the background update, so a dot that stays on
  // (always-on laser) is never absorbed into the background.
  function run(d, o){
    const sens = o.sens == null ? 60 : o.sens;
    const minBright = Math.round(250 - sens * 1.2);
    const diffT = Math.round(110 - sens);
    const dom = 40;
    const wantRed = o.color !== 'green', wantGreen = o.color !== 'red';
    const maxCand = Math.floor(n * 0.04);
    const warm = frames < WARM;
    const alpha = warm ? 0.5 : 0.06;
    mask.fill(0);
    let count = 0;

    for(let i = 0, p = 0; i < n; i++, p += 4){
      const r = d[p], g = d[p + 1], b = d[p + 2];
      const m = r > g ? (r > b ? r : b) : (g > b ? g : b);
      let s = 0;
      if(wantRed){ const t = r - (g > b ? g : b); if(t > s) s = t; }
      if(wantGreen){ const t = g - (r > b ? r : b); if(t > s) s = t; }
      curM[i] = m; curS[i] = s;
      if(warm) continue;
      let c = 0;
      if(s >= dom && m >= minBright && s - bgS[i] >= diffT) c = 1;            // colored fringe
      else if(r > 235 && g > 235 && b > 235 && m - bgM[i] >= diffT) c = 2;   // blown-out core
      if(c){ mask[i] = c; count++; }
    }
    const flooded = !warm && count > maxCand;
    for(let i = 0; i < n; i++){
      if(warm || flooded || !mask[i]){ bgM[i] += (curM[i] - bgM[i]) * alpha; bgS[i] += (curS[i] - bgS[i]) * alpha; }
    }
    frames++;
    if(warm || flooded || count === 0) return { blob: null, flooded };

    // Largest 4-connected component that contains at least one colored pixel.
    let best = null;
    for(let i = 0; i < n; i++){
      if(!mask[i]) continue;
      let sp = 0; stack[sp++] = i;
      let col = mask[i] === 1 ? 1 : 0; mask[i] = 0;
      let cnt = 0, sx = 0, sy = 0;
      while(sp){
        const j = stack[--sp]; cnt++;
        const x = j % W, y = (j - x) / W; sx += x; sy += y;
        if(x > 0 && mask[j - 1]){ if(mask[j - 1] === 1) col++; mask[j - 1] = 0; stack[sp++] = j - 1; }
        if(x < W - 1 && mask[j + 1]){ if(mask[j + 1] === 1) col++; mask[j + 1] = 0; stack[sp++] = j + 1; }
        if(y > 0 && mask[j - W]){ if(mask[j - W] === 1) col++; mask[j - W] = 0; stack[sp++] = j - W; }
        if(y < H - 1 && mask[j + W]){ if(mask[j + W] === 1) col++; mask[j + W] = 0; stack[sp++] = j + W; }
      }
      if(cnt >= 2 && col > 0 && (!best || cnt > best.n)) best = { x: sx / cnt + 0.5, y: sy / cnt + 0.5, n: cnt };
    }
    return { blob: best, flooded: false };
  }
  return { run, get frames(){ return frames; } };
}
// @ldt-detector-end

// ---------------------------------------------------------------------------
// Geometry. Four tapped corners -> homography onto the unit square.
// ---------------------------------------------------------------------------
// @ldt-geom-start
function solveLinear(A, B){
  const n = B.length;
  const M = A.map((row, i) => row.concat([B[i]]));
  for(let col = 0; col < n; col++){
    let piv = col;
    for(let r = col + 1; r < n; r++) if(Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
    if(Math.abs(M[piv][col]) < 1e-12) return null;
    const tmp = M[col]; M[col] = M[piv]; M[piv] = tmp;
    for(let r = 0; r < n; r++){
      if(r === col) continue;
      const f = M[r][col] / M[col][col];
      if(!f) continue;
      for(let k = col; k <= n; k++) M[r][k] -= f * M[col][k];
    }
  }
  return M.map((row, i) => row[n] / row[i]);
}
// corners: [{x,y} TL, TR, BR, BL] in image space
function homographyToUnit(corners){
  const dst = [[0, 0], [1, 0], [1, 1], [0, 1]];
  const A = [], B = [];
  for(let i = 0; i < 4; i++){
    const x = corners[i].x, y = corners[i].y, u = dst[i][0], v = dst[i][1];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); B.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); B.push(v);
  }
  const h = solveLinear(A, B);
  return h ? [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1] : null;
}
function applyH(h, x, y){
  const w = h[6] * x + h[7] * y + 1;
  return [(h[0] * x + h[1] * y + h[2]) / w, (h[3] * x + h[4] * y + h[5]) / w];
}
// Inverse homography, normalized so the last entry is 1. Maps unit-square points back to the image.
function invertH(h){
  const a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], k = h[7], i = h[8] == null ? 1 : h[8];
  const A = e * i - f * k, B = -(d * i - f * g), C = d * k - e * g;
  const det = a * A + b * B + c * C;
  if(Math.abs(det) < 1e-12) return null;
  const inv = [A, -(b * i - c * k), b * f - c * e, B, a * i - c * g, -(a * f - c * d), C, -(a * k - b * g), a * e - b * d];
  if(Math.abs(inv[8]) < 1e-12) return null;
  return inv.map(v => v / inv[8]);
}
// @ldt-geom-end

// ---------------------------------------------------------------------------
// Targets. Pure; needs applyH. Hs: one homography per calibrated target.
// ---------------------------------------------------------------------------
// @ldt-targets-start
function zoneOn(Hm, x, y, tw, th){
  const uv = applyH(Hm, x, y), u = uv[0], v = uv[1];
  const dx = (u - 0.5) * tw, dy = (v - 0.5) * th, r = Math.hypot(dx, dy);
  const onPaper = Math.abs(dx) <= tw / 2 && Math.abs(dy) <= th / 2;
  let zone = 'Miss';
  if(r <= 0.15 * tw) zone = 'A'; else if(r <= 0.30 * tw) zone = 'C'; else if(onPaper) zone = 'D';
  return { zone: zone, u: u, v: v };
}
// called: index of the called target, or null for free shots. Returns {zone, u, v, hit}.
// u and v are relative to the called target; a hit on another target is 'Wrong'.
function classifyHit(Hs, called, x, y, tw, th){
  const c = called == null ? 0 : called;
  const own = zoneOn(Hs[c], x, y, tw, th);
  if(own.zone !== 'Miss') return { zone: own.zone, u: own.u, v: own.v, hit: c };
  for(let i = 0; i < Hs.length; i++){
    if(i === c) continue;
    const r = zoneOn(Hs[i], x, y, tw, th);
    if(r.zone !== 'Miss') return called == null ? { zone: r.zone, u: r.u, v: r.v, hit: i } : { zone: 'Wrong', u: own.u, v: own.v, hit: i };
  }
  return { zone: 'Miss', u: own.u, v: own.v, hit: -1 };
}
// True when (x, y) lies within `margin` target sizes of any target's center region.
function nearAnyTarget(Hs, x, y, margin){
  return Hs.some(Hm => { const uv = applyH(Hm, x, y); return Math.abs(uv[0] - 0.5) <= margin && Math.abs(uv[1] - 0.5) <= margin; });
}
// True when (x, y) is near a target or inside the box spanning every target's corners,
// so a miss between sheets still counts while a rack far off to the side does not.
function withinTargets(Hs, cornerSets, x, y, margin){
  if(nearAnyTarget(Hs, x, y, margin)) return true;
  if(cornerSets.length < 2) return false;
  const xs = [], ys = [];
  cornerSets.forEach(cs => cs.forEach(c => { xs.push(c.x); ys.push(c.y); }));
  return x >= Math.min.apply(null, xs) && x <= Math.max.apply(null, xs) && y >= Math.min.apply(null, ys) && y <= Math.max.apply(null, ys);
}
// Random target index; never the same target three times in a row.
function pickTarget(n, recent, rnd){
  if(n <= 1) return 0;
  let opts = [];
  for(let i = 0; i < n; i++) opts.push(i);
  const k = recent.length;
  if(k >= 2 && recent[k - 1] === recent[k - 2]) opts = opts.filter(i => i !== recent[k - 1]);
  return opts[Math.floor(rnd() * opts.length) % opts.length];
}
// @ldt-targets-end

// ---------------------------------------------------------------------------
// Trigger-click detection. Pure; runs inside an AudioWorklet via toString().
// Emits {type:'click', t, peak, floor} at each impulsive onset and
// {type:'level', v, floor} every 50 ms for the meter.
// ---------------------------------------------------------------------------
// @ldt-click-start
function createClickDetector(sampleRate){
  let env = 0.001, hold = 0, t = 0, peak = 0, lvl = 0, lvlN = 0;
  const holdN = Math.round(sampleRate * 0.05);
  const lvlEvery = Math.round(sampleRate * 0.05);
  const k = 1 / (sampleRate * 0.25);
  return function process(ch, startTime, out){
    for(let i = 0; i < ch.length; i++){
      const a = ch[i] < 0 ? -ch[i] : ch[i];
      if(a > lvl) lvl = a;
      if(++lvlN >= lvlEvery){ out.push({ type: 'level', v: lvl, floor: env }); lvl = 0; lvlN = 0; }
      if(hold > 0){
        if(a > peak) peak = a;
        if(--hold === 0) out.push({ type: 'click', t: t, peak: peak, floor: env });
        continue;
      }
      env += (a - env) * k;
      if(a > 0.02 && a > env * 8){ t = startTime + i / sampleRate; peak = a; hold = holdN; }
    }
  };
}
// @ldt-click-end

// ---------------------------------------------------------------------------
// Aim check. Pure. A click counts only when the dot was steady before it.
// samples: [{t, x, y}] with x null when no dot. Returns {ok, reason, at}.
// ---------------------------------------------------------------------------
// @ldt-aim-start
function aimCheck(samples, tp, o){
  const win = o.windowMs || 250, minFrac = o.minFrac || 0.6, maxSpread = o.maxSpread || 12;
  const inWin = samples.filter(s => s.t >= tp - win && s.t <= tp + 40);
  if(!inWin.length) return { ok: false, reason: 'no frames' };
  const seen = inWin.filter(s => s.x != null);
  if(seen.length / inWin.length < minFrac) return { ok: false, reason: 'no dot' };
  let mx = 0, my = 0;
  seen.forEach(s => { mx += s.x; my += s.y; });
  mx /= seen.length; my /= seen.length;
  let spread = 0;
  seen.forEach(s => { const d = Math.hypot(s.x - mx, s.y - my); if(d > spread) spread = d; });
  if(spread > maxSpread) return { ok: false, reason: 'moving' };
  let at = seen[0], bd = 1e9;
  seen.forEach(s => { const d = Math.abs(s.t - tp); if(d < bd){ bd = d; at = s; } });
  return { ok: true, reason: '', at: at };
}
// @ldt-aim-end

// ---------------------------------------------------------------------------
// Analysis. Pure. Summarizes reps and writes coaching notes.
// reps: recorded rep objects. o: { targetW, targetH } in inches.
// ---------------------------------------------------------------------------
// @ldt-analysis-start
function analyzeReps(reps, o){
  const W = o.targetW, H = o.targetH;
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const median = a => { const b = a.slice().sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
  const r2 = x => Math.round(x * 100) / 100;
  const out = { reps: reps.length, timed: 0, outliers: 0, avg: null, avgAll: null, best: null, underPar: 0,
    zones: { A: 0, C: 0, D: 0, Miss: 0, Wrong: 0, Hit: 0, 'No shot': 0, Early: 0 }, biasX: null, biasY: null, perTarget: null,
    spreadX: null, spreadY: null, mvMedian: null, trend: null, suggestedPar: null, notes: [] };
  reps.forEach(r => { const z = r.early ? 'Early' : r.zone; if(z in out.zones) out.zones[z]++; });
  const timed = reps.filter(r => r.t != null && !r.early);
  out.timed = timed.length;
  if(!timed.length){ out.notes.push('Complete a few reps to see your analysis.'); return out; }
  const allT = timed.map(r => r.t), med = median(allT);
  const core = timed.filter(r => r.t <= med * 1.6);
  out.outliers = timed.length - core.length;
  out.avgAll = r2(mean(allT));
  out.avg = r2(mean(core.map(r => r.t)));
  out.best = r2(Math.min.apply(null, allT));
  out.underPar = timed.filter(r => r.t <= r.par).length;
  // Placement uses on-paper hits from normal-speed reps; slow outliers are usually a missed shot plus a later sound.
  const coreSet = new Set(core);
  const placed = reps.filter(r => r.u != null && r.v != null && Math.abs(r.u - 0.5) <= 0.5 && Math.abs(r.v - 0.5) <= 0.5 && (r.t == null || coreSet.has(r)));
  if(placed.length){
    const xs = placed.map(r => (r.u - 0.5) * W), ys = placed.map(r => (0.5 - r.v) * H);
    out.biasX = r2(mean(xs)); out.biasY = r2(mean(ys));
    out.spreadX = r2(Math.max.apply(null, xs) - Math.min.apply(null, xs));
    out.spreadY = r2(Math.max.apply(null, ys) - Math.min.apply(null, ys));
  }
  const mvs = reps.filter(r => r.mv != null).map(r => r.mv);
  if(mvs.length) out.mvMedian = r2(median(mvs));
  if(core.length >= 6){
    const k = Math.floor(core.length / 3);
    const first = mean(core.slice(0, k).map(r => r.t)), last = mean(core.slice(-k).map(r => r.t));
    out.trend = r2(last - first);
  }
  const par = timed[timed.length - 1].par;
  const n = out.notes;
  if(out.outliers) n.push(out.outliers + ' slow rep' + (out.outliers > 1 ? 's' : '') + ' (over 1.6x your median) excluded from the average.');
  if(out.underPar === 0 && out.avg > par){
    out.suggestedPar = Math.round(out.avg * 20) / 20;
    n.push('No reps beat the ' + par.toFixed(2) + ' s par. Set par to ' + out.suggestedPar.toFixed(2) + ' s, your current average, and tighten it as you beat it.');
  } else if(timed.length >= 5 && out.underPar / timed.length >= 0.7){
    out.suggestedPar = Math.round((par - 0.1) * 20) / 20;
    n.push('You beat par on ' + out.underPar + ' of ' + timed.length + ' reps. Tighten par to ' + out.suggestedPar.toFixed(2) + ' s.');
  }
  if(out.spreadY != null && placed.length >= 4){
    if(out.spreadY > 2 && out.spreadY > out.spreadX * 1.5){
      let msg = 'Hits string vertically (' + out.spreadY.toFixed(1) + ' in tall, ' + out.spreadX.toFixed(1) + ' in wide).';
      if(out.biasY > 0.5) msg += ' They sit high, which usually means the shot breaks while the muzzle is still rising into the target.';
      else if(out.biasY < -0.5) msg += ' They sit low, which usually means pushing the muzzle down in anticipation of recoil.';
      n.push(msg);
    } else if(out.spreadX > 2 && out.spreadX > out.spreadY * 1.5){
      n.push('Hits spread horizontally (' + out.spreadX.toFixed(1) + ' in wide). Focus on pressing the trigger straight to the rear.');
    }
    if(Math.abs(out.biasX) > 0.75) n.push('Hits average ' + Math.abs(out.biasX).toFixed(1) + ' in ' + (out.biasX > 0 ? 'right' : 'left') + ' of center.');
  }
  if(out.trend != null){
    if(out.trend > 0.2) n.push('Your last reps averaged ' + out.trend.toFixed(2) + ' s slower than your first. Rest between sets.');
    else if(out.trend < -0.2) n.push('Your last reps averaged ' + (-out.trend).toFixed(2) + ' s faster than your first.');
  }
  const tset = Array.from(new Set(reps.map(r => r.target).filter(x => x != null))).sort((a, b) => a - b);
  if(tset.length > 1){
    out.perTarget = tset.map(tg => {
      const rs = reps.filter(r => r.target === tg), tt = core.filter(r => r.target === tg).map(r => r.t);
      return { target: tg, n: rs.length, avg: tt.length ? r2(mean(tt)) : null, hits: rs.filter(r => r.zone === 'A' || r.zone === 'C' || r.zone === 'D').length };
    });
    const tm = out.perTarget.filter(p => p.avg != null);
    if(tm.length > 1){
      const slow = tm.reduce((a, b) => b.avg > a.avg ? b : a), fast = tm.reduce((a, b) => b.avg < a.avg ? b : a);
      if(slow.avg - fast.avg > 0.25) n.push('Target ' + slow.target + ' averages ' + (slow.avg - fast.avg).toFixed(2) + ' s slower than target ' + fast.target + '. Practice that transition.');
    }
  }
  if(out.zones.Wrong) n.push(out.zones.Wrong + ' shot' + (out.zones.Wrong > 1 ? 's' : '') + ' hit the wrong target. Confirm the callout before you press.');
  if(out.mvMedian != null && out.mvMedian > 1) n.push('Median dot movement before the break is ' + out.mvMedian.toFixed(2) + ' in. Let the dot stop before you finish the press.');
  if(!n.length) n.push('Solid set. Keep par where it is and repeat.');
  return out;
}
// @ldt-analysis-end

// ---------------------------------------------------------------------------
// Strings and screen test. Pure; covered by tests/run.js.
// ---------------------------------------------------------------------------
// @ldt-reset-start
// Trigger profile from Learn trigger click. presses: [[{t, peak}, ...]], the sounds of each press in order:
// one sound for a trigger that needs racking, or two (the break, then the reset on release) for a
// resetting trigger. Returns { mode: 'none'|'level'|'skip', thr, break, reset, gapMs }.
function learnTrigger(presses){
  const r2 = x => Math.round(x * 100) / 100, clamp = x => Math.max(0.03, Math.min(0.9, x));
  const med = a => { const b = a.slice().sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
  const pairs = presses.filter(p => p.length >= 2);
  if(pairs.length * 2 < presses.length){
    const peaks = presses.map(p => p[0].peak);
    return { mode: 'none', thr: clamp(r2(Math.min.apply(null, peaks) * 0.5)), break: r2(med(peaks)), reset: null, gapMs: null };
  }
  const breaks = pairs.map(p => p[0].peak), resets = pairs.map(p => p[1].peak), gaps = pairs.map(p => p[1].t - p[0].t);
  const minB = Math.min.apply(null, breaks), maxR = Math.max.apply(null, resets);
  const gapMs = Math.max(300, Math.min(1200, Math.round(Math.max.apply(null, gaps) * 1.5 / 25) * 25));
  const base = { break: r2(med(breaks)), reset: r2(med(resets)), gapMs };
  if(minB >= maxR * 1.6) return Object.assign({ mode: 'level', thr: clamp(r2(Math.sqrt(minB * maxR))) }, base);
  return Object.assign({ mode: 'skip', thr: clamp(r2(Math.min.apply(null, breaks.concat(resets)) * 0.5)) }, base);
}
// Sorts one microphone sound into 'quiet', 'reset', 'dup', or 'shot'. s: { last, due } persists between calls.
// p: { mode, thr, gapMs }. In 'skip' mode, the first sound within gapMs after a shot is that press's reset click.
function classifySound(s, t, peak, p, debounceMs){
  if(peak < p.thr) return 'quiet';
  if(p.mode === 'skip' && s.due && t - s.last <= p.gapMs){ s.due = false; return 'reset'; }
  if(t - s.last < debounceMs) return 'dup';
  s.last = t; s.due = p.mode === 'skip';
  return 'shot';
}
// @ldt-reset-end

// @ldt-score-start
// Comstock scoring for one string. shots: [{zone, target}] where target is the 0-based target hit (-1 for none).
// o: { targets, perTarget, pf: 'minor'|'major', time: string time in seconds }.
// The best `perTarget` hits on each target count; each required hit not made is a miss (-10 points).
function scoreString(shots, o){
  const pts = o.pf === 'major' ? { A: 5, C: 4, D: 2 } : { A: 5, C: 3, D: 1 };
  if(shots.some(s => s.zone === 'Hit')) return null;   // uncalibrated: no zones to score
  const zones = { A: 0, C: 0, D: 0 };
  let points = 0, misses = 0;
  for(let t = 0; t < o.targets; t++){
    const best = shots.filter(s => s.target === t && pts[s.zone] != null).map(s => s.zone)
      .sort((a, b) => pts[b] - pts[a]).slice(0, o.perTarget);
    best.forEach(z => { zones[z]++; points += pts[z]; });
    misses += o.perTarget - best.length;
  }
  const penalty = misses * 10, net = Math.max(0, points - penalty);
  return { points, penalty, net, misses, zones, fired: shots.length, hf: o.time > 0 ? Math.round(net / o.time * 10000) / 10000 : 0 };
}
// Collects the shots of one string. o: { rounds, gapMs, minSplitMs }. Times are ms from the beep.
// add() returns 'dup' for a sound within minSplitMs of the last shot, 'done' at the round count, else 'shot'.
// idle(now) is true once a shot exists and no other shot has followed for gapMs.
function createStringTracker(o){
  const shots = [], minSplit = o.minSplitMs == null ? 100 : o.minSplitMs, gap = o.gapMs == null ? 3000 : o.gapMs;
  return {
    shots,
    add(t, data){
      const last = shots[shots.length - 1];
      if(last && t - last.t < minSplit) return 'dup';
      shots.push(Object.assign({}, data, { t: t, split: last ? t - last.t : null }));
      return shots.length >= o.rounds ? 'done' : 'shot';
    },
    idle(now){ const last = shots[shots.length - 1]; return !!last && now - last.t >= gap; }
  };
}
// Summarizes recorded strings and writes coaching notes. Split times in seconds.
function analyzeStrings(strings){
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const r2 = x => Math.round(x * 100) / 100;
  const out = { strings: strings.length, timed: 0, avg: null, best: null, underPar: 0, first: null, split: null, bestSplit: null,
    transition: null, hf: null, bestHf: null, zones: { A: 0, C: 0, D: 0 }, misses: 0, early: 0, noShot: 0, suggestedPar: null, notes: [] };
  strings.forEach(s => { if(s.early) out.early++; else if(!s.shots || !s.shots.length) out.noShot++; });
  const done = strings.filter(s => !s.early && s.t != null && s.shots && s.shots.length);
  out.timed = done.length;
  if(!done.length){ out.notes.push('Complete a few strings to see your analysis.'); return out; }
  out.avg = r2(mean(done.map(s => s.t)));
  out.best = r2(Math.min.apply(null, done.map(s => s.t)));
  out.underPar = done.filter(s => s.t <= s.par).length;
  out.first = r2(mean(done.map(s => s.first)));
  const same = [], trans = [];
  done.forEach(s => s.shots.forEach((sh, i) => {
    if(!i || sh.split == null) return;
    const prev = s.shots[i - 1];
    (prev.target != null && sh.target != null && prev.target !== sh.target ? trans : same).push(sh.split);
  }));
  if(same.length){ out.split = r2(mean(same)); out.bestSplit = r2(Math.min.apply(null, same)); }
  if(trans.length) out.transition = r2(mean(trans));
  const scored = done.filter(s => s.hf != null && s.zones);
  if(scored.length){
    out.hf = r2(mean(scored.map(s => s.hf)));
    out.bestHf = r2(Math.max.apply(null, scored.map(s => s.hf)));
    scored.forEach(s => { out.zones.A += s.zones.A; out.zones.C += s.zones.C; out.zones.D += s.zones.D; out.misses += s.misses; });
  }
  const par = done[done.length - 1].par, n = out.notes;
  if(out.underPar === 0 && out.avg > par){
    out.suggestedPar = Math.round(out.avg * 20) / 20;
    n.push('No strings beat the ' + par.toFixed(2) + ' s par. Set par to ' + out.suggestedPar.toFixed(2) + ' s, your current average, and tighten it as you beat it.');
  } else if(done.length >= 5 && out.underPar / done.length >= 0.7){
    out.suggestedPar = Math.round((par - 0.2) * 20) / 20;
    n.push('You beat par on ' + out.underPar + ' of ' + done.length + ' strings. Tighten par to ' + out.suggestedPar.toFixed(2) + ' s.');
  }
  if(out.split != null && out.transition != null && out.transition - out.split > 0.15)
    n.push('Transitions average ' + out.transition.toFixed(2) + ' s against ' + out.split.toFixed(2) + ' s splits on one target. Move your eyes to the next target as the last shot on the current one breaks.');
  if(out.misses) n.push(out.misses + (out.misses > 1 ? ' misses cost ' : ' miss cost ') + out.misses * 10 + ' penalty points.');
  const hits = out.zones.A + out.zones.C + out.zones.D;
  if(hits >= 8 && (out.zones.C + out.zones.D) / hits > 0.4)
    n.push(Math.round((out.zones.C + out.zones.D) / hits * 100) + '% of hits landed outside the A zone. Confirm the sight picture on each shot before you press.');
  if(!n.length) n.push('Solid set. Keep par where it is and repeat.');
  return out;
}
// @ldt-score-end

// @ldt-screen-start
// Range colors for the TV picture. Blue leads every color, so neither a red nor a green laser
// detector reads the picture as a dot.
const RANGE_PALETTE = { bg: [18, 24, 32], berm: [40, 50, 62], target: [176, 186, 200], ring: [128, 142, 162], steel: [92, 110, 134], text: [170, 186, 208] };
// Laser-color dominance of one color: how far its red or green channel leads the other two.
function laserDominance(rgb){
  const r = rgb[0], g = rgb[1], b = rgb[2];
  return Math.max(r - Math.max(g, b), g - Math.max(r, b), 0);
}
// frames: [{t, lum: Uint8Array(W*H)}] captured while the TV alternates white and black.
// Returns {corners: [TL, TR, BR, BL], area, contrast} for the region that changes, or null.
function findScreenQuad(frames, W, H){
  const n = W * H;
  if(!frames || frames.length < 4) return null;
  const means = frames.map(f => { let s = 0; for(let i = 0; i < n; i++) s += f.lum[i]; return s / n; });
  let lo = Infinity, hi = -Infinity;
  means.forEach(m => { if(m < lo) lo = m; if(m > hi) hi = m; });
  if(hi - lo < 2) return null;
  const mid = (lo + hi) / 2;
  const bright = new Float32Array(n), dark = new Float32Array(n);
  let nb = 0, nd = 0;
  frames.forEach((f, k) => {
    const acc = means[k] >= mid ? bright : dark;
    if(acc === bright) nb++; else nd++;
    for(let i = 0; i < n; i++) acc[i] += f.lum[i];
  });
  if(!nb || !nd) return null;
  const mask = new Uint8Array(n), diff = new Float32Array(n);
  let peak = 0;
  for(let i = 0; i < n; i++){ diff[i] = bright[i] / nb - dark[i] / nd; if(diff[i] > peak) peak = diff[i]; }
  if(peak < 30) return null;
  const thr = Math.max(20, peak * 0.4);
  for(let i = 0; i < n; i++) if(diff[i] >= thr) mask[i] = 1;
  const stack = new Int32Array(n);
  let best = null;
  for(let i = 0; i < n; i++){
    if(!mask[i]) continue;
    let sp = 0; stack[sp++] = i; mask[i] = 0;
    const c = { n: 0, s0: Infinity, s1: -Infinity, d0: Infinity, d1: -Infinity, tl: null, br: null, tr: null, bl: null };
    while(sp){
      const j = stack[--sp]; c.n++;
      const x = j % W, y = (j - x) / W, s = x + y, d = x - y;
      if(s < c.s0){ c.s0 = s; c.tl = { x: x, y: y }; }
      if(s > c.s1){ c.s1 = s; c.br = { x: x + 1, y: y + 1 }; }
      if(d > c.d1){ c.d1 = d; c.tr = { x: x + 1, y: y }; }
      if(d < c.d0){ c.d0 = d; c.bl = { x: x, y: y + 1 }; }
      if(x > 0 && mask[j - 1]){ mask[j - 1] = 0; stack[sp++] = j - 1; }
      if(x < W - 1 && mask[j + 1]){ mask[j + 1] = 0; stack[sp++] = j + 1; }
      if(y > 0 && mask[j - W]){ mask[j - W] = 0; stack[sp++] = j - W; }
      if(y < H - 1 && mask[j + W]){ mask[j + W] = 0; stack[sp++] = j + W; }
    }
    if(!best || c.n > best.n) best = c;
  }
  if(!best || best.n < n * 0.02) return null;
  return { corners: [best.tl, best.tr, best.br, best.bl], area: best.n / n, contrast: Math.round(peak) };
}
// samples: [{t, v}] mean brightness inside the screen per camera frame, in time order.
// switches: [{t, on}] times the picture turned white (on) or black.
// For each switch after the first, finds the first frame that shows the new level.
// Returns { delay: median ms, matched: switches seen, spread: max - min ms }.
function flashSync(samples, switches){
  const none = { delay: null, matched: 0, spread: null };
  if(!samples || samples.length < 4 || !switches || switches.length < 2) return none;
  let lo = Infinity, hi = -Infinity;
  samples.forEach(s => { if(s.v < lo) lo = s.v; if(s.v > hi) hi = s.v; });
  if(hi - lo < 10) return none;
  const mid = (lo + hi) / 2, ds = [];
  for(let k = 1; k < switches.length; k++){   // the level before the first switch is unknown
    const sw = switches[k];
    let prev = null;
    for(const s of samples){
      if(s.t < sw.t){ prev = s.v; continue; }
      const isNew = sw.on ? s.v >= mid : s.v < mid;
      if(isNew){
        const wasOld = prev != null && (sw.on ? prev < mid : prev >= mid);
        if(wasOld && s.t - sw.t < 1500) ds.push(s.t - sw.t);
        break;
      }
      prev = s.v;
    }
  }
  if(!ds.length) return none;
  ds.sort((a, b) => a - b);
  const m = ds.length >> 1;
  return { delay: Math.round(ds.length % 2 ? ds[m] : (ds[m - 1] + ds[m]) / 2), matched: ds.length, spread: Math.round(ds[ds.length - 1] - ds[0]) };
}
// Median display delay in ms, or null when fewer than two switches were seen.
function estimateDelay(samples, switches){
  const r = flashSync(samples, switches);
  return r.matched >= 2 ? r.delay : null;
}
// True when the region flashed in step with the test: most switches seen with a steady delay.
function inStep(sync, switches){
  return sync.matched >= Math.max(2, switches.length - 3) && sync.spread != null && sync.spread <= 200;
}
// @ldt-screen-end

const DEFAULTS = { mode: 'always', clickThr: 0.15, color: 'red', sens: 60, minDelay: 2, maxDelay: 5, par: 1.5, timeout: 8, targetW: 8.5, targetH: 11, latency: 0, repeatDelay: 6, parBeep: false, auto: true, nTargets: 1, drill: 'draw', perTarget: 2, pf: 'minor', stringPar: 3, trigMode: 'none', resetMs: 600, breakLvl: null, resetLvl: null, ver: 2 };
const LS_SET = 'ldt.settings', LS_HIST = 'ldt.history', LS_CAL = 'ldt.calibration', LS_TV = 'ldt.tvtest';
function lsGet(k, fallback){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const S = Object.assign({}, DEFAULTS, lsGet(LS_SET, {}));
if((lsGet(LS_SET, {}).ver || 1) < 2){ S.parBeep = false; S.ver = 2; lsSet(LS_SET, S); }
let history = lsGet(LS_HIST, []);
if(!Array.isArray(history)) history = [];

const btnLearn = $('btnLearn'), meter = $('meter'), meterBar = $('meterBar'), meterThr = $('meterThr');
const btnReset = $('btnReset'), btnCopy = $('btnCopy'), btnClear = $('btnClear');
const map = $('map'), statsEl = $('stats'), histEl = $('history'), stage = $('stage');

  drill: 'sDrill', perTarget: 'sPerTarget', pf: 'sPF', stringPar: 'sStringPar', trigMode: 'sTrig', resetMs: 'sResetMs' };
function loadFields(){

}

    else if(el.tagName === 'SELECT') S[k] = el.value;
    else { const v = parseFloat(el.value); S[k] = isFinite(v) ? v : DEFAULTS[k]; el.value = S[k]; }
    if(k === 'perTarget'){ S.perTarget = Math.max(1, Math.min(6, Math.round(S.perTarget) || 2)); el.value = S.perTarget; }
    lsSet(LS_SET, S); drawMap();
    if(k === 'drill'){ if(st.drill !== 'idle') stopDrill(); syncDrillFields(); renderStats(); renderAnalysis(); }
  });
}
loadFields();
function syncDrillFields(){
  document.querySelectorAll('[data-drill]').forEach(el => { el.hidden = el.dataset.drill !== S.drill; });
}
syncDrillFields();
const curPar = () => S.drill === 'string' ? S.stringPar : S.par;
const rounds = () => S.nTargets * S.perTarget;

// ---------------------------------------------------------------------------
// Runtime state
// ---------------------------------------------------------------------------
const DEBOUNCE_MS = 150, MIN_SPLIT_MS = 100, STRING_GAP_MS = 3000, STRING_MAX_MS = 60000;
let W = 320, H = 240, det = null, srcW = 0, srcH = 0;
const st = { camOn: false, dotOn: false, dotSince: 0, dot: null, lastShotAt: -1e9, lastHit: null, lastHitAt: 0, flooded: false,
  calibrating: false, calTi: 0, targets: [], drag: null, called: null, recentCalls: [], speechGate: null, drill: 'idle', rep: 0, beepAt: 0, timers: [], session: [],
  dotBuf: [], lastClickAt: -1e9, gates: [], learn: null, mic: null, lastTrace: [], string: null, sim: false, noShotTimer: 0, gapTimer: 0, snd: { last: -1e9, due: false } };

const fmt = t => t.toFixed(2);
function setStatus(msg){ statusEl.textContent = msg; }
function showZone(z){ zoneEl.textContent = (z === 'A' || z === 'C' || z === 'D') ? z + ' zone' : z === 'Wrong' ? 'Wrong target' : z; }
function showTime(t){
  clock.innerHTML = fmt(t) + '<small>s</small>';
  const done = st.drill === 'done';
  clock.classList.toggle('under', done && t > 0 && t <= curPar());
  clock.classList.toggle('over', done && t > curPar());
}
function timer(fn, ms){ const id = setTimeout(fn, ms); st.timers.push(id); return id; }
function clearTimers(){ st.timers.forEach(id => clearTimeout(id)); st.timers = []; }

function initBuffers(){
  srcW = video.videoWidth || 640; srcH = video.videoHeight || 480;
  W = 320; H = Math.max(120, Math.round(320 * srcH / srcW));
  work.width = W; work.height = H; overlay.width = W; overlay.height = H;
  stage.style.aspectRatio = srcW + ' / ' + srcH;
  det = createDetector(W, H);
  st.targets = []; st.calibrating = false; st.drag = null; st.dotOn = false; st.dot = null;
  btnCal.textContent = 'Calibrate';
  const saved = lsGet(LS_CAL, null);
  if(saved && saved.srcW === srcW && saved.srcH === srcH && saved.W === W && Array.isArray(saved.targets) && saved.targets.length === S.nTargets){
    st.targets = saved.targets.map(c => ({ corners: c, H: homographyToUnit(c) }));
    if(calibrated()){ btnCal.textContent = 'Recalibrate'; return true; }
    st.targets = [];
  }
  return false;
}
function calibrated(){ return st.targets.length > 0 && st.targets.length === S.nTargets && st.targets.every(t => t.H); }
function Hs(){ return st.targets.map(t => t.H); }
function saveCalib(){
  lsSet(LS_CAL, calibrated() ? { srcW, srcH, W, targets: st.targets.map(t => t.corners) } : null);
}

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
async function startCamera(){
  if(st.camOn){ stopCamera(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('This browser cannot open the camera. Open the page in Safari or Chrome.'); return;
  }
  ensureAudio();
  btnCam.disabled = true; setStatus('Opening camera.');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 }, frameRate: { ideal: 60 } }
    });
    video.srcObject = stream;
    await video.play();
    await new Promise(res => { if(video.videoWidth) res(); else video.addEventListener('loadedmetadata', res, { once: true }); });
    const restored = initBuffers();
    st.camOn = true;
    btnCam.textContent = 'Stop camera'; btnCal.disabled = false; btnDrill.disabled = false;
    const s = stream.getVideoTracks()[0].getSettings();
    pill.dataset.base = (s.width || '?') + 'x' + (s.height || '?') + (s.frameRate ? ' at ' + Math.round(s.frameRate) + ' fps' : '');
    updatePill(); pill.classList.add('on');
    hint.textContent = restored ? '' : 'Holster, tap Calibrate, then tap the four corners of ' + (S.nTargets > 1 ? 'each target.' : 'the target.');
    setStatus(restored ? 'Calibration restored. Drag a corner to adjust, or tap Recalibrate if the phone moved.' : '');
    loop();
    if(S.mode === 'always') await startMic();
  }catch(err){
    setStatus('Camera failed: ' + err.name + '. Allow camera access and try again.');
  }
  btnCam.disabled = false;
}
function stopCamera(){
  st.camOn = false;
  const s = video.srcObject; if(s) s.getTracks().forEach(t => t.stop());
  video.srcObject = null;
  stopDrill();
  stopMic();
  btnCam.textContent = 'Start camera'; btnCal.disabled = true; btnDrill.disabled = true;
  pill.textContent = 'Camera off'; pill.classList.remove('on');
  octx.clearRect(0, 0, W, H);
  hint.textContent = 'Start the camera, then calibrate the target.';
}
function loop(){
  if(!st.camOn) return;
  if('requestVideoFrameCallback' in video){
    video.requestVideoFrameCallback((now, meta) => { processFrame((meta && meta.captureTime) || now); loop(); });
  } else {
    requestAnimationFrame(now => { processFrame(now); loop(); });
  }
}
function processFrame(ts){
  if(!st.camOn) return;
  if(video.videoWidth && (video.videoWidth !== srcW || video.videoHeight !== srcH)){
    initBuffers(); setStatus('Camera orientation changed. Calibrate again.');
    if(tv.on && tv.phase !== 'intro' && tv.phase !== 'done' && tv.phase !== 'fail') tvFail('The phone moved or rotated during the test. Hold it still, then tap Try again.');
  }
  if(!det) return;
  wctx.drawImage(video, 0, 0, W, H);
  const d = wctx.getImageData(0, 0, W, H).data;
  const res = det.run(d, { sens: S.sens, color: S.color });
  st.flooded = res.flooded;
  if(tv.on){ tvFrame(ts, d, res); return; }
  st.dotBuf.push({ t: ts, x: res.blob ? res.blob.x : null, y: res.blob ? res.blob.y : null });
  while(st.dotBuf.length && st.dotBuf[0].t < ts - 2000) st.dotBuf.shift();
  if(res.blob){
    if(!st.dotOn){
      st.dotOn = true; st.dotSince = ts;
      if(S.mode === 'pulse' && ts - st.lastShotAt >= DEBOUNCE_MS){ st.lastShotAt = ts; onShot(ts, res.blob, null); }
    }
    st.dot = res.blob;
  } else { st.dotOn = false; st.dot = null; }
  drawOverlay(ts);
}

// ---------------------------------------------------------------------------
// Calibration
// ---------------------------------------------------------------------------
const CORNER_NAMES = ['top-left', 'top-right', 'bottom-right', 'bottom-left'];
function calPrompt(){
  const t = st.calTi, c = st.targets[t] ? st.targets[t].corners.length : 0;
  hint.textContent = (S.nTargets > 1 ? 'Target ' + (t + 1) + ': tap' : 'Tap') + ' the ' + CORNER_NAMES[c] + ' corner.';
}
btnCal.addEventListener('click', () => {
  if(st.drill !== 'idle') stopDrill();
  st.calibrating = true; st.calTi = 0; st.targets = [{ corners: [], H: null }];
  if(det) det = createDetector(W, H);
  calPrompt(); setStatus('');
});
function toWork(e){
  const r = overlay.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H, sx: r.width / W, sy: r.height / H };
}
overlay.addEventListener('pointerdown', e => {
  if(!st.camOn) return;
  const p = toWork(e);
  if(st.calibrating){
    e.preventDefault();
    const t = st.targets[st.calTi];
    t.corners.push({ x: p.x, y: p.y });
    if(t.corners.length < 4){ calPrompt(); return; }
    t.H = homographyToUnit(t.corners);
    if(!t.H){ t.corners = []; hint.textContent = 'Those corners do not form a quadrilateral. Tap the ' + CORNER_NAMES[0] + ' corner again.'; return; }
    if(st.calTi + 1 < S.nTargets){ st.calTi++; st.targets.push({ corners: [], H: null }); calPrompt(); return; }
    st.calibrating = false; saveCalib();
    btnCal.textContent = 'Recalibrate'; hint.textContent = '';
    setStatus('Calibrated. Drag any corner to adjust. Holster, then tap Start drill.');
    return;
  }
  if(st.drill === 'standby' || st.drill === 'listening' || !st.targets.length) return;
  let best = null, bd = 28;   // CSS px grab radius
  st.targets.forEach((t, ti) => t.corners.forEach((c, ci) => {
    const d = Math.hypot((c.x - p.x) * p.sx, (c.y - p.y) * p.sy);
    if(d < bd){ bd = d; best = { ti, ci }; }
  }));
  if(!best) return;
  e.preventDefault();
  st.drag = best;
  try{ overlay.setPointerCapture(e.pointerId); }catch(err){}
});
overlay.addEventListener('pointermove', e => {
  if(!st.drag) return;
  e.preventDefault();
  const p = toWork(e), t = st.targets[st.drag.ti];
  t.corners[st.drag.ci] = { x: Math.max(0, Math.min(W, p.x)), y: Math.max(0, Math.min(H, p.y)) };
  const h = homographyToUnit(t.corners);
  if(h) t.H = h;
});
function endDrag(){
  if(!st.drag) return;
  st.drag = null;
  if(calibrated()){ saveCalib(); setStatus('Corner adjusted.'); }
}
overlay.addEventListener('pointerup', endDrag);
overlay.addEventListener('pointercancel', endDrag);
$('sTargets').addEventListener('change', () => {
  S.nTargets = Math.max(1, Math.min(4, Math.round(S.nTargets) || 1));
  $('sTargets').value = S.nTargets; lsSet(LS_SET, S);
  st.targets = []; st.calibrating = false; saveCalib();
  btnCal.textContent = 'Calibrate';
  setStatus('Tap Calibrate and mark ' + S.nTargets + ' target' + (S.nTargets > 1 ? 's' : '') + '.');
});

const zoneA = () => 0.15 * S.targetW;
const zoneC = () => 0.30 * S.targetW;
function scoreHit(x, y){
  if(!calibrated()) return { zone: 'Hit', u: null, v: null, hit: -1 };
  return classifyHit(Hs(), st.called, x, y, S.targetW, S.targetH);
}
function onAnyPaper(x, y){ return !calibrated() || nearAnyTarget(Hs(), x, y, 0.5); }

// ---------------------------------------------------------------------------
// Drill: draw to first shot
// ---------------------------------------------------------------------------
let actx = null, wakeLock = null, clockRaf = 0;
function ensureAudio(){
  if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
  if(actx && actx.state === 'suspended') actx.resume();
}
// Context time -> performance.now() time base.
function ctxToPerf(ct){
  if(!actx) return performance.now();
  const ts = actx.getOutputTimestamp ? actx.getOutputTimestamp() : null;
  if(ts && ts.performanceTime) return ts.performanceTime + (ct - ts.contextTime) * 1000;
  return performance.now() - (actx.currentTime - ct) * 1000;
}
// Schedules a tone and returns the performance.now() time it sounds.
function beep(freq, dur){
  ensureAudio(); if(!actx) return performance.now();
  const t0 = actx.currentTime + 0.02;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.005);
  g.gain.setValueAtTime(0.5, t0 + dur - 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
  const at = ctxToPerf(t0);
  st.gates.push([at - 30, at + dur * 1000 + 120]);
  if(st.gates.length > 20) st.gates.shift();
  return at;
}
async function keepAwake(){
  try{ if('wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }catch(e){}
}
function startClock(){
  cancelAnimationFrame(clockRaf);
  const tick = () => {
    if(st.drill !== 'listening') return;
    const e = Math.max(0, (performance.now() - st.beepAt) / 1000);
    showTime(e); parVisual(e); clock.classList.toggle('live-over', e > curPar());
    clockRaf = requestAnimationFrame(tick);
  };
  clockRaf = requestAnimationFrame(tick);
}
function stopClock(){ cancelAnimationFrame(clockRaf); }
const parBar = $('parBar'), parFill = $('parFill');
function parVisual(e){
  const over = e > curPar();
  parFill.style.width = Math.min(100, e / curPar() * 100) + '%';
  parBar.classList.toggle('over', over);
  stage.classList.toggle('par-under', !over);
  stage.classList.toggle('par-over', over);
}
function clearPar(){
  parFill.style.width = '0%'; parBar.classList.remove('over');
  stage.classList.remove('par-under', 'par-over'); clock.classList.remove('live-over');
}

const WORDS = ['One', 'Two', 'Three', 'Four'];
const calloutEl = $('callout');
let speechUnlocked = false;
function unlockSpeech(){
  if(speechUnlocked || !('speechSynthesis' in window)) return;
  try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); speechUnlocked = true; }catch(e){}
}
function sayTarget(i){
  st.speechGate = [st.beepAt - 30, st.beepAt + 900];
  if('speechSynthesis' in window){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(WORDS[i]);
      u.rate = 1.3; u.lang = 'en-US';
      u.onend = () => { if(st.speechGate) st.speechGate[1] = performance.now() + 150; };
      speechSynthesis.speak(u);
      return;
    }catch(e){}
  }
  for(let k = 0; k <= i; k++) setTimeout(() => beep(1200, 0.05), 150 + k * 130);   // fallback: N short beeps
}
function showCallout(i){ calloutEl.textContent = i == null ? '' : String(i + 1); calloutEl.classList.toggle('on', i != null); }

function startRep(){
  clearTimers();
  const strings = S.drill === 'string';
  st.rep++; st.drill = 'standby';
  clearPar(); st.called = null; st.speechGate = null; showCallout(null);
  st.string = strings ? createStringTracker({ rounds: rounds(), gapMs: STRING_GAP_MS, minSplitMs: MIN_SPLIT_MS }) : null;
  btnDrill.textContent = 'Stop'; btnDrill.disabled = false;
  showTime(0); showZone('\u2014'); repLabel.textContent = (strings ? 'String ' : 'Rep ') + st.rep;
  setStatus(st.sim ? 'Simulated string. Standby.' : 'Standby.');
  const delay = (S.minDelay + Math.random() * Math.max(0, S.maxDelay - S.minDelay)) * 1000;
  timer(() => {
    if(!strings){
      st.called = pickTarget(S.nTargets, st.recentCalls, Math.random);
      st.recentCalls.push(st.called); if(st.recentCalls.length > 10) st.recentCalls.shift();
    }
    st.beepAt = beep(1800, 0.12);
    const lead = Math.max(0, st.beepAt - performance.now());
    if(!strings && S.nTargets > 1){
      setTimeout(() => sayTarget(st.called), lead + 140);
      showCallout(st.called);
      repLabel.textContent = 'Rep ' + st.rep + ' \u00b7 target ' + (st.called + 1);
    }
    st.drill = 'listening';
    setStatus(strings ? 'Go. ' + rounds() + ' shots: ' + S.perTarget + ' on ' + (S.nTargets > 1 ? 'each of ' + S.nTargets + ' targets.' : 'the target.') : 'Go.');
    startClock();
    if(S.parBeep) timer(() => beep(1000, 0.08), curPar() * 1000 + lead);
    st.noShotTimer = timer(onTimeout, S.timeout * 1000 + lead);
    if(strings) timer(() => finishString('max'), STRING_MAX_MS + lead);
    if(st.sim) runSimShots(lead);
  }, delay);
}
function onTimeout(){
  stopClock(); st.drill = 'done';
  if(st.string) recordString({ shots: [], reason: 'timeout' });
  else recordRep({ t: null, zone: 'No shot', u: null, v: null, early: false });
  showZone('No shot');
  setStatus((st.string ? 'String ' : 'Rep ') + st.rep + ': no shot within ' + S.timeout + ' s. Tap Start drill to continue.');
  idleAfterRep();
}
// Leaves the drill ready for one tap on Start drill.
function idleAfterRep(){
  clearTimers();
  st.drill = 'idle'; st.string = null; st.sim = false;
  btnDrill.textContent = 'Start drill'; btnDrill.disabled = !st.camOn;
}
function endRep(){ if(S.auto && !st.sim) scheduleNext(); else idleAfterRep(); }
function scheduleNext(){
  btnDrill.textContent = 'Stop';
  let left = S.repeatDelay;
  const word = S.drill === 'string' ? 'string' : 'rep', what = S.drill === 'string' ? 'Holster.' : 'Reset the slide and holster.';
  setStatus('Next ' + word + ' in ' + left + ' s. ' + what);
  const tickId = setInterval(() => {
    left--;
    if(left <= 0){ clearTimeout(tickId); return; }
    setStatus('Next ' + word + ' in ' + left + ' s. ' + what);
  }, 1000);
  st.timers.push(tickId);
  timer(startRep, S.repeatDelay * 1000);
}
function stopDrill(){
  clearTimers(); stopClock(); clearPar();
  st.called = null; st.speechGate = null; showCallout(null);
  if(st.drill !== 'idle'){ setStatus('Drill stopped.'); }
  st.drill = 'idle'; st.string = null; st.sim = false;
  btnDrill.textContent = 'Start drill'; btnDrill.disabled = !st.camOn;
}
btnDrill.addEventListener('click', () => {
  if(st.drill === 'idle'){ ensureAudio(); unlockSpeech(); keepAwake(); startRep(); }
  else stopDrill();
});
btnBeep.addEventListener('click', () => beep(1800, 0.12));

function onShot(ts, blob, mv, lvl){
  const hit = scoreHit(blob.x, blob.y);
  st.lastHit = { px: blob.x, py: blob.y, u: hit.u, v: hit.v, zone: hit.zone }; st.lastHitAt = performance.now();
  st.lastMv = mv;
  if(st.string && st.drill === 'listening'){ onStringShot(ts, hit, mv, lvl); drawMap(); return; }
  if(st.drill === 'listening'){
    clearTimers(); stopClock();
    const t = Math.max(0, (ts - st.beepAt - S.latency) / 1000);
    st.drill = 'done';
    recordRep({ t, zone: hit.zone, u: hit.u, v: hit.v, early: false, mv, hitTarget: hit.hit, lvl });
    clock.classList.remove('live-over'); parVisual(t); showCallout(null);
    showTime(t); showZone(hit.zone);
    repLabel.textContent = 'Rep ' + st.rep + (S.nTargets > 1 ? ' \u00b7 T' + (st.called + 1) : '') + (mv != null ? ' \u00b7 moved ' + mv.toFixed(2) + ' in' : '');
    setStatus('Rep ' + st.rep + ': ' + fmt(t) + ' s, ' + (hit.zone === 'Hit' ? 'hit (not calibrated)' : hit.zone === 'Wrong' ? 'wrong target (hit ' + (hit.hit + 1) + ', called ' + (st.called + 1) + ')' : hit.zone) + (mv != null ? ', dot moved ' + mv.toFixed(2) + ' in during the press' : '') + '.');
    endRep();
  } else if(st.drill === 'standby'){
    clearTimers(); stopClock();
    st.drill = 'done';
    if(st.string) recordString({ early: true });
    else recordRep({ t: null, zone: hit.zone, u: hit.u, v: hit.v, early: true, mv, hitTarget: hit.hit });
    showZone('Early');
    setStatus((st.string ? 'String ' : 'Rep ') + st.rep + ': shot before the beep.');
    endRep();
  } else {
    showZone(hit.zone);
    if(mv != null) repLabel.textContent = 'Moved ' + mv.toFixed(2) + ' in';
    setStatus('Free shot: ' + (hit.zone === 'Hit' ? 'hit (calibrate for zones)' : hit.zone) + (mv != null ? ', dot moved ' + mv.toFixed(2) + ' in during the press' : '') + '.');
  }
  drawMap();
}

// ---------------------------------------------------------------------------
// Drill: strings (multi-shot with a resetting trigger)
// ---------------------------------------------------------------------------
const r3 = x => Math.round(x * 1000) / 1000;
function onStringShot(ts, hit, mv, lvl){
  const t = ts - st.beepAt - S.latency;   // ms from the beep
  const res = st.string.add(t, { zone: hit.zone, u: hit.u, v: hit.v, target: hit.hit, mv: mv == null ? null : Math.round(mv * 100) / 100, lvl: lvl == null ? null : Math.round(lvl * 100) / 100 });
  if(res === 'dup') return;
  const shots = st.string.shots, last = shots[shots.length - 1];
  if(shots.length === 1) clearTimeout(st.noShotTimer);

  S.clickThr = prof.thr; S.trigMode = prof.mode; S.breakLvl = prof.break; S.resetLvl = prof.reset;
  if(prof.gapMs) S.resetMs = prof.gapMs;
  lsSet(LS_SET, S); loadFields();
  clearTimeout(L.timer); st.learn = null; btnLearn.textContent = 'Learn trigger click';
  if(prof.mode === 'level') setStatus('Trigger click ' + prof.break.toFixed(2) + ', reset click ' + prof.reset.toFixed(2) + '. Threshold set to ' + prof.thr.toFixed(2) + ', so the reset click is ignored.');
  else if(prof.mode === 'skip') setStatus('Trigger click ' + prof.break.toFixed(2) + ' and reset click ' + prof.reset.toFixed(2) + ' are close in level. The first click within ' + S.resetMs + ' ms after each shot counts as its reset.');
  else setStatus('One click per press. Click threshold set to ' + prof.thr.toFixed(2) + '.');
}
btnLearn.addEventListener('click', async () => {
  if(st.learn){ clearTimeout(st.learn.timer); st.learn = null; btnLearn.textContent = 'Learn trigger click'; setStatus('Click learning cancelled.'); return; }
  if(st.drill !== 'idle') stopDrill();
  if(!(await startMic())) return;
  st.learn = { presses: [], cur: null, timer: 0 };
  btnLearn.textContent = 'Cancel learning';
  setStatus('Hold the dot steady on the target. Press and release the trigger 3 times, pausing between presses. Racking is ignored.');
});
$('sMode').addEventListener('change', async () => {
  if(S.mode === 'always' && st.camOn) await startMic();
  if(S.mode === 'pulse') stopMic();
});

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function drawOverlay(ts){
  octx.clearRect(0, 0, W, H);
  const live = st.drill === 'listening' || st.drill === 'done';
  st.targets.forEach((t, ti) => {
    const cs = t.corners;
    if(!cs.length) return;
    const called = live && st.called === ti && S.nTargets > 1;
    octx.strokeStyle = called ? '#3fd37f' : '#ff7a2e'; octx.lineWidth = called ? 4 : 2; octx.beginPath();
    cs.forEach((c, i) => { if(i) octx.lineTo(c.x, c.y); else octx.moveTo(c.x, c.y); });
    if(cs.length === 4) octx.closePath();
    octx.stroke();
    octx.fillStyle = '#ff7a2e';
    cs.forEach((c, ci) => {
      const dragging = st.drag && st.drag.ti === ti && st.drag.ci === ci;
      octx.beginPath(); octx.arc(c.x, c.y, dragging ? 9 : 5, 0, Math.PI * 2); octx.fill();
    });
    if(S.nTargets > 1 && cs.length === 4){
      const mx = (cs[0].x + cs[1].x + cs[2].x + cs[3].x) / 4, my = (cs[0].y + cs[1].y + cs[2].y + cs[3].y) / 4;
      octx.font = 'bold 22px sans-serif'; octx.textAlign = 'center'; octx.textBaseline = 'middle';
      octx.lineWidth = 4; octx.strokeStyle = 'rgba(0,0,0,.7)'; octx.strokeText(String(ti + 1), mx, my);
      octx.fillStyle = '#ffffff'; octx.fillText(String(ti + 1), mx, my);
      octx.textAlign = 'start'; octx.textBaseline = 'alphabetic';
    }
  });
  if(st.dot){ octx.strokeStyle = '#ffffff'; octx.lineWidth = 2; octx.beginPath(); octx.arc(st.dot.x, st.dot.y, 8, 0, Math.PI * 2); octx.stroke(); }
  if(st.lastHit && ts - st.lastHitAt < 2000){ octx.strokeStyle = '#ff7a2e'; octx.lineWidth = 3; octx.beginPath(); octx.arc(st.lastHit.px, st.lastHit.py, 12, 0, Math.PI * 2); octx.stroke(); }
  if(st.flooded){
    octx.fillStyle = 'rgba(0,0,0,.65)'; octx.fillRect(0, 0, W, 22);
    octx.fillStyle = '#ffffff'; octx.font = '12px sans-serif';
    octx.fillText('Too much light. Lower sensitivity or dim the room.', 6, 15);
  }
}
function drawMap(){
  const mw = 150, mh = Math.max(40, Math.round(150 * S.targetH / S.targetW));
  if(map.height !== mh) map.height = mh;
  const c = map.getContext('2d');
  c.clearRect(0, 0, mw, mh);
  c.fillStyle = '#f6f7f4'; c.fillRect(0, 0, mw, mh);
  c.strokeStyle = '#5d6864'; c.lineWidth = 1; c.strokeRect(0.5, 0.5, mw - 1, mh - 1);
  const sx = mw / S.targetW, cx = mw / 2, cy = mh / 2;
  c.beginPath(); c.arc(cx, cy, zoneC() * sx, 0, Math.PI * 2); c.stroke();
  c.fillStyle = '#15191b'; c.beginPath(); c.arc(cx, cy, zoneA() * sx, 0, Math.PI * 2); c.fill();
  if(st.lastTrace && st.lastTrace.length > 1){
    c.strokeStyle = 'rgba(21,25,27,.55)'; c.lineWidth = 1.5; c.beginPath();
    st.lastTrace.forEach((p, i) => { const x = p[0] * mw, y = p[1] * mh; if(i) c.lineTo(x, y); else c.moveTo(x, y); });
    c.stroke();
  }
  let pts;
  if(S.drill === 'string'){
    const live = st.string && st.string.shots.length ? st.string.shots : null;
    const last = st.session.filter(r => r.kind === 'string' && r.shots && r.shots.length).slice(-1)[0];
    pts = (live || (last ? last.shots : [])).filter(r => r.u != null);
  } else pts = st.session.filter(r => r.kind !== 'string' && r.u != null).slice(-30);
  pts.forEach(r => { c.fillStyle = 'rgba(228,99,26,.6)'; c.beginPath(); c.arc(r.u * mw, r.v * mh, 3.5, 0, Math.PI * 2); c.fill(); });
  if(st.lastHit && st.lastHit.u != null){
    c.fillStyle = '#e4631a'; c.beginPath(); c.arc(st.lastHit.u * mw, st.lastHit.v * mh, 5, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#ffffff'; c.lineWidth = 1.5; c.stroke();
  }
}

// ---------------------------------------------------------------------------
// Session log
// ---------------------------------------------------------------------------
function recordRep(r){
  const rep = { kind: 'draw', n: st.rep, t: r.t, zone: r.zone, u: r.u, v: r.v, early: !!r.early, mv: r.mv == null ? null : Math.round(r.mv * 100) / 100, par: S.par, mode: S.mode,
    target: st.called == null ? null : st.called + 1, targets: S.nTargets, hitTarget: r.hitTarget == null || r.hitTarget < 0 ? null : r.hitTarget + 1, lvl: r.lvl == null ? null : Math.round(r.lvl * 100) / 100, trig: S.trigMode, at: new Date().toISOString() };
  st.session.push(rep);
  history.push(rep);
  if(history.length > 500) history = history.slice(-500);
  lsSet(LS_HIST, history);
  renderStats();
  renderAnalysis();
}
function renderStats(){
  const row = (k, v) => '<div class="row"><span>' + k + '</span><b>' + v + '</b></div>';
  if(S.drill === 'string'){
    const strs = st.session.filter(r => r.kind === 'string');
    const done = strs.filter(r => !r.early && r.t != null && r.shots && r.shots.length);
    const scored = done.filter(r => r.hf != null);
    const avg = done.length ? done.reduce((a, r) => a + r.t, 0) / done.length : null;
    const best = done.length ? Math.min.apply(null, done.map(r => r.t)) : null;
    const hf = scored.length ? scored.reduce((a, r) => a + r.hf, 0) / scored.length : null;
    statsEl.innerHTML = strs.length
      ? row('Strings', strs.length) + row('Average', avg != null ? fmt(avg) + ' s' : '\u2014') + row('Best', best != null ? fmt(best) + ' s' : '\u2014')
        + row('Under par', done.length ? done.filter(r => r.t <= r.par).length + ' of ' + done.length : '\u2014') + row('Hit factor', hf != null ? hf.toFixed(2) : '\u2014')
        + row('Shots', done.reduce((a, r) => a + r.shots.length, 0))
      : '<div class="empty">Session stats appear here after the first string.</div>';
  } else {
    const reps = st.session.filter(r => r.kind !== 'string'), timed = reps.filter(r => r.t != null);
    const hits = reps.filter(r => r.zone === 'A' || r.zone === 'C' || r.zone === 'D' || r.zone === 'Hit');
    const avg = timed.length ? timed.reduce((a, r) => a + r.t, 0) / timed.length : null;
    const best = timed.length ? Math.min.apply(null, timed.map(r => r.t)) : null;
    const under = timed.filter(r => r.t <= r.par).length;
    const moved = reps.filter(r => r.mv != null);
    const avgMv = moved.length ? moved.reduce((a, r) => a + r.mv, 0) / moved.length : null;
    statsEl.innerHTML = reps.length
      ? row('Reps', reps.length) + row('Average', avg != null ? fmt(avg) + ' s' : '\u2014') + row('Best', best != null ? fmt(best) + ' s' : '\u2014')
        + row('Under par', timed.length ? under + ' of ' + timed.length : '\u2014') + row('Hits', hits.length + ' of ' + reps.length) + (avgMv != null ? row('Avg movement', avgMv.toFixed(2) + ' in') : '')
      : '<div class="empty">Session stats appear here after the first rep.</div>';
  }
  const recent = history.concat(st.session.filter(r => r.sim)).sort((a, b) => a.at < b.at ? 1 : a.at > b.at ? -1 : 0).slice(0, 20);
  histEl.innerHTML = recent.length
    ? '<table><tr><th>Time</th><th>Result</th><th>Move</th><th>When</th></tr>' + recent.map(r => {
        const when = new Date(r.at);
        const t = r.early ? 'Early' : (r.t == null ? '\u2014' : fmt(r.t) + ' s');
        const str = r.kind === 'string';
        const result = str ? (r.hf != null ? 'HF ' + r.hf.toFixed(2) : r.zone) : r.zone;
        const move = str ? (r.shots && r.shots.length ? r.shots.length + ' shot' + (r.shots.length > 1 ? 's' : '') : '\u2014') : (r.mv != null ? r.mv.toFixed(2) + ' in' : '\u2014');
        return '<tr><td class="t">' + t + '</td><td>' + result + '</td><td>' + move + '</td><td>' + (r.sim ? 'Simulated ' : '') + when.toLocaleDateString() + ' ' + when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '</td></tr>';
      }).join('') + '</table>'
    : '';
}
const anaScope = $('anaScope'), anaGrid = $('anaGrid'), anaNotes = $('anaNotes'), btnPar = $('btnPar');
function renderAnalysis(){
  const all = anaScope.value === 'all' ? history : st.session;
  const cell = (k, v) => '<div><span>' + k + '</span><b>' + v + '</b></div>';
  const dash = '\u2014', sec = v => v == null ? dash : v.toFixed(2) + ' s', inch = v => v == null ? dash : v.toFixed(2) + ' in';
  if(S.drill === 'string'){
    const b = analyzeStrings(all.filter(r => r.kind === 'string'));
    const hf = v => v == null ? dash : v.toFixed(2);
    anaGrid.innerHTML = cell('Average', sec(b.avg)) + cell('Best', sec(b.best)) + cell('Under par', b.timed ? b.underPar + '/' + b.timed : dash)
      + cell('Hit factor', hf(b.hf)) + cell('Best HF', hf(b.bestHf)) + cell('First shot', sec(b.first))
      + cell('Split', sec(b.split)) + cell('Transition', sec(b.transition)) + cell('A/C/D/miss', b.zones.A + '/' + b.zones.C + '/' + b.zones.D + '/' + b.misses);
    $('anaTargets').innerHTML = '';
    anaNotes.innerHTML = b.notes.map(t => '<li>' + t + '</li>').join('');
    showParButton(b.suggestedPar);
    return;
  }
  const reps = all.filter(r => r.kind !== 'string');
  const a = analyzeReps(reps, { targetW: S.targetW, targetH: S.targetH });
  const z = a.zones;
  const vert = a.biasY == null ? dash : Math.abs(a.biasY).toFixed(1) + ' in ' + (a.biasY >= 0 ? 'high' : 'low');
  const horz = a.biasX == null ? dash : Math.abs(a.biasX).toFixed(1) + ' in ' + (a.biasX >= 0 ? 'right' : 'left');
  anaGrid.innerHTML = cell('Average', sec(a.avg)) + cell('Best', sec(a.best)) + cell('Under par', a.timed ? a.underPar + '/' + a.timed : dash)
    + cell('A / C / D', z.A + ' / ' + z.C + ' / ' + z.D) + cell('Miss / wrong / none', (z.Miss + z.Early) + ' / ' + z.Wrong + ' / ' + z['No shot']) + cell('Movement', inch(a.mvMedian))
    + cell('Vertical', vert) + cell('Horizontal', horz) + cell('Spread', a.spreadY == null ? dash : a.spreadX.toFixed(1) + '\u00d7' + a.spreadY.toFixed(1) + ' in');
  $('anaTargets').innerHTML = a.perTarget ? a.perTarget.map(p => '<div><span>Target ' + p.target + '</span><span>' + (p.avg == null ? '\u2014' : p.avg.toFixed(2) + ' s') + ' \u00b7 ' + p.hits + '/' + p.n + ' hits</span></div>').join('') : '';
  anaNotes.innerHTML = a.notes.map(t => '<li>' + t + '</li>').join('');
  showParButton(a.suggestedPar);
}
function showParButton(p){
  if(p != null && Math.abs(p - curPar()) > 0.001){
    btnPar.hidden = false; btnPar.textContent = 'Set ' + (S.drill === 'string' ? 'string par' : 'par') + ' to ' + p.toFixed(2) + ' s'; btnPar.dataset.par = p;
  } else btnPar.hidden = true;
}
anaScope.addEventListener('change', renderAnalysis);
btnPar.addEventListener('click', () => {
  S[S.drill === 'string' ? 'stringPar' : 'par'] = parseFloat(btnPar.dataset.par); lsSet(LS_SET, S); loadFields(); renderAnalysis();
  setStatus((S.drill === 'string' ? 'String par' : 'Par') + ' set to ' + curPar().toFixed(2) + ' s.');
});
btnCopy.addEventListener('click', async () => {
  const text = JSON.stringify(history, null, 2);
  try{ await navigator.clipboard.writeText(text); setStatus('Copied ' + history.length + ' reps as JSON.'); }
  catch(e){ setStatus('Clipboard unavailable. Allow clipboard access and try again.'); }
});
btnClear.addEventListener('click', () => {
  history = []; st.session = []; st.lastHit = null; lsSet(LS_HIST, history);
  renderStats(); renderAnalysis(); drawMap(); setStatus('History cleared.');
});
btnReset.addEventListener('click', () => { Object.assign(S, DEFAULTS); lsSet(LS_SET, S); loadFields(); syncDrillFields(); drawMap(); renderStats(); renderAnalysis(); setStatus('Settings reset.'); });
btnCam.addEventListener('click', startCamera);
document.addEventListener('visibilitychange', () => { if(document.hidden && st.drill !== 'idle') stopDrill(); });

renderStats();
if(!st.session.length && history.length) anaScope.value = 'all';
renderAnalysis();
drawMap();
})();
</script>
