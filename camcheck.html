<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dual-camera check</title>
<style>
:root{
  color-scheme:light;
  --bg:#e4e7e2; --surface:#f6f7f4; --text:#15191b; --muted:#5d6864; --line:#bcc4bd;
  --accent:#e4631a; --accent-ink:#ffffff; --ok:#1d8a4a; --bad:#c42a1b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#171b1e; --surface:#21272b; --text:#eef1ee; --muted:#95a19c; --line:#343d42;
    --accent:#ff7a2e; --accent-ink:#15191b; --ok:#3fd37f; --bad:#ff5a47;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171b1e; --surface:#21272b; --text:#eef1ee; --muted:#95a19c; --line:#343d42;
  --accent:#ff7a2e; --accent-ink:#15191b; --ok:#3fd37f; --bad:#ff5a47;
}
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:"Helvetica Neue",Arial,sans-serif; font-size:16px; line-height:1.4; }
.app{ max-width:600px; margin:0 auto; padding:16px 14px 40px; }
h1{ font-size:26px; margin:0 0 6px; }
p{ margin:6px 0; color:var(--muted); }
.views{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
figure{ margin:0; }
video{ width:100%; aspect-ratio:3/4; background:#101314; border-radius:10px; object-fit:cover; display:block; }
figcaption{ font-size:14px; color:var(--muted); margin-top:4px; }
button{ font:inherit; font-weight:600; font-size:18px; padding:12px 16px; min-height:48px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); cursor:pointer; }
button.quiet{ background:var(--surface); color:var(--text); border-color:var(--line); font-size:15px; }
button:disabled{ opacity:.45; }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; }
#status{ min-height:24px; margin:12px 0 4px; color:var(--text); }
#verdict{ font-size:22px; font-weight:700; margin:8px 0; }
#verdict.ok{ color:var(--ok); } #verdict.bad{ color:var(--bad); }
pre{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; overflow-x:auto; white-space:pre-wrap; word-break:break-word; }
pre:empty{ display:none; }
</style>
</head>
<body>
<div class="app">
  <h1>Dual-camera check</h1>
  <p>Tests whether this browser can run the rear and front cameras at the same time. It takes about 10 seconds and records nothing.</p>
  <div class="views">
    <figure><video id="vRear" playsinline muted autoplay></video><figcaption>Rear camera</figcaption></figure>
    <figure><video id="vFront" playsinline muted autoplay></video><figcaption>Front camera</figcaption></figure>
  </div>
  <div class="actions">
    <button id="btnRun">Run check</button>
    <button id="btnCopy" class="quiet" hidden>Copy results</button>
  </div>
  <div id="status" aria-live="polite"></div>
  <div id="verdict"></div>
  <pre id="out"></pre>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const vRear = $('vRear'), vFront = $('vFront'), btnRun = $('btnRun'), btnCopy = $('btnCopy'), statusEl = $('status'), verdictEl = $('verdict'), out = $('out');
const WATCH_MS = 5000, SETTLE_MS = 1500, MIN_FRAMES = 30;
const wait = ms => new Promise(r => setTimeout(r, ms));
let streams = [], result = null;

async function openCam(facing){
  try{ return { stream: await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { exact: facing } } }), exact: true }; }
  catch(e){
    if(e.name !== 'OverconstrainedError' && e.name !== 'NotFoundError') throw e;
    return { stream: await navigator.mediaDevices.getUserMedia({ audio: false, video: true }), exact: false };
  }
}
// Counts frames a video actually presents, so a frozen or black feed scores zero.
function frameCounter(video){
  const c = { n: 0, on: true };
  if('requestVideoFrameCallback' in video){
    const tick = () => { if(!c.on) return; c.n++; video.requestVideoFrameCallback(tick); };
    video.requestVideoFrameCallback(tick);
  } else {
    let last = -1;
    const tick = () => { if(!c.on) return; if(video.currentTime !== last){ last = video.currentTime; c.n++; } requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
  return c;
}
function describe(track, frames, events){
  const s = track.getSettings ? track.getSettings() : {};
  return { state: track.readyState, muted: track.muted, frames, events, facing: s.facingMode || null, label: track.label || null, size: (s.width || '?') + 'x' + (s.height || '?') };
}
function stopAll(){ streams.forEach(s => s.getTracks().forEach(t => t.stop())); streams = []; }

async function run(){
  stopAll(); result = null;
  btnRun.disabled = true; btnCopy.hidden = true; verdictEl.textContent = ''; verdictEl.className = ''; out.textContent = '';
  const res = { at: new Date().toISOString(), agent: navigator.userAgent, verdict: 'error', rear: null, front: null, distinct: null, error: null };
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('This browser cannot open the camera.');
    statusEl.textContent = 'Opening the rear camera.';
    const a = await openCam('environment');
    streams.push(a.stream); vRear.srcObject = a.stream; await vRear.play().catch(() => {});
    const ta = a.stream.getVideoTracks()[0], evA = [];
    ['ended', 'mute', 'unmute'].forEach(n => ta.addEventListener(n, () => evA.push(n)));
    await wait(SETTLE_MS);

    statusEl.textContent = 'Opening the front camera.';
    const b = await openCam('user');
    streams.push(b.stream); vFront.srcObject = b.stream; await vFront.play().catch(() => {});
    const tb = b.stream.getVideoTracks()[0], evB = [];
    ['ended', 'mute', 'unmute'].forEach(n => tb.addEventListener(n, () => evB.push(n)));

    statusEl.textContent = 'Watching both cameras for ' + WATCH_MS / 1000 + ' seconds.';
    await wait(500);
    const ca = frameCounter(vRear), cb = frameCounter(vFront);
    await wait(WATCH_MS);
    ca.on = false; cb.on = false;

    res.rear = describe(ta, ca.n, evA); res.front = describe(tb, cb.n, evB);
    const sa = ta.getSettings ? ta.getSettings() : {}, sb = tb.getSettings ? tb.getSettings() : {};
    res.distinct = a.exact && b.exact && (!sa.deviceId || !sb.deviceId || sa.deviceId !== sb.deviceId);
    const alive = (t, n) => t.readyState === 'live' && !t.muted && n >= MIN_FRAMES;
    const rearOk = alive(ta, ca.n), frontOk = alive(tb, cb.n);
    res.verdict = rearOk && frontOk ? (res.distinct ? 'both' : 'one_camera') : 'one_at_a_time';
  }catch(e){
    res.error = (e && e.name ? e.name + ': ' : '') + (e && e.message ? e.message : String(e));
  }
  stopAll();
  result = res;
  const text = {
    both: 'Pass. Both cameras ran at the same time.',
    one_at_a_time: 'Fail. This browser runs one camera at a time.',
    one_camera: 'Inconclusive. This device reported only one camera.',
    error: 'The check could not run. Allow camera access and try again.'
  }[res.verdict];
  verdictEl.textContent = text; verdictEl.className = res.verdict === 'both' ? 'ok' : 'bad';
  statusEl.textContent = res.error ? res.error : 'Rear camera: ' + res.rear.frames + ' frames, ' + res.rear.state + (res.rear.muted ? ', muted' : '') + '. Front camera: ' + res.front.frames + ' frames, ' + res.front.state + (res.front.muted ? ', muted' : '') + '.';
  out.textContent = JSON.stringify(res, null, 2);
  btnCopy.hidden = false; btnRun.disabled = false; btnRun.textContent = 'Run again';
}
btnRun.addEventListener('click', run);
btnCopy.addEventListener('click', async () => {
  try{ await navigator.clipboard.writeText(JSON.stringify(result, null, 2)); btnCopy.textContent = 'Copied'; setTimeout(() => { btnCopy.textContent = 'Copy results'; }, 1500); }
  catch(e){ btnCopy.textContent = 'Clipboard blocked'; }
});
window.__camcheck = { streams: () => streams };
})();
</script>
</body>
</html>
